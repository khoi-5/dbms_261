
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mini-ecommerce

  # Java properties syntax, not shell dotenv. Run Maven from backend/.
  # OS environment variables override values imported from this file.
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${DB_URL}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    # Leave empty for Windows Authentication; set both for SQL Authentication.
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

app:
  catalog:
    default-page-size: ${CATALOG_DEFAULT_PAGE_SIZE:12}
    max-page-size: ${CATALOG_MAX_PAGE_SIZE:48}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
